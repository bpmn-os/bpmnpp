# Build the Doxygen documentation and publish it to GitHub Pages.
#
# The library itself is not compiled. Configuring is enough: schematic++ generates the BPMN classes from
# the schemas during configure, and those generated classes are part of the Doxygen input. schematic++ is
# resolved by the configure step, which builds it in a sub-build when no installed copy is found, so the
# runner installs only xerces, doxygen and graphviz.
#
# A plain build folder is used rather than one of the presets, since none of their compiler settings apply
# to a run that compiles nothing.

name: Deploy Docs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libxerces-c-dev cmake build-essential git

      - name: Generate Docs
        run: |
          cmake -S . -B build
          # The diagram interchange classes are generated but not documented.
          cd build/xml/bpmn
          find . -type f -regex '\./[a-z][^A-Z]*' -delete
          grep -l "XML-Schema:    xsd/BPMNDI.xsd" *.h | xargs rm
          grep -l "XML-Schema:    xsd/DI.xsd" *.h | xargs rm
          grep -l "XML-Schema:    xsd/DC.xsd" *.h | xargs rm
          cd ../../..
          cmake --build build --target docs
          # drop Doxygen's dot intermediates — not needed to serve the SVGs, and they shrink the site
          rm -f build/docs/html/*.md5 build/docs/html/*.map

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/html
